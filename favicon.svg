<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="8" y="8" width="112" height="112" rx="36" fill="url(#bgGradient)" stroke="#ddd6fe" stroke-width="2.5" filter="url(#softShadow)" />

  <!-- Monogram JS -->
  <text 
    x="64" 
    y="80" 
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
    font-size="54" 
    font-weight="800" 
    fill="url(#textGradient)" 
    text-anchor="middle" 
    letter-spacing="-1.5">JS</text>
</svg>

